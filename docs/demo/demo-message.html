<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntelliWhisper Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  background: #0d0d0f;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

/* ── Screen container ─────────────────────────────────────────────────────── */
.screen {
  width: 860px;
  height: 520px;
  background: radial-gradient(ellipse at 30% 20%, #1c1035 0%, #0e1520 55%, #0b1018 100%);
  border-radius: 14px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 50px 120px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.06);
  user-select: none;
}

/* ── Menu bar ─────────────────────────────────────────────────────────────── */
.menu-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 26px;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  padding: 0 14px;
  z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.mb-apple { font-size: 14px; color: rgba(255,255,255,0.8); margin-right: 18px; }

.mb-items { display: flex; gap: 18px; font-size: 12px; color: rgba(255,255,255,0.75); font-weight: 500; }

.mb-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: rgba(255,255,255,0.6);
}

/* ── Floating pill ────────────────────────────────────────────────────────── */
.pill-wrap {
  position: absolute;
  top: 34px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}

.pill-wrap.visible { opacity: 1; }

.pill {
  background: rgba(0,0,0,0.78);
  border-radius: 22px;
  padding: 10px 16px;
  border: 0.5px solid rgba(255,255,255,0.18);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 8px 28px rgba(0,0,0,0.5);
  transition: box-shadow 0.4s ease, border-color 0.4s ease;
  display: flex;
  align-items: center;
  overflow: hidden;
}

.pill.glow {
  border-color: rgba(0,190,154,0.8);
  box-shadow: 0 0 0 0px transparent, 0 0 18px rgba(0,190,154,0.45), 0 8px 28px rgba(0,0,0,0.5);
}

/* ── Recording state ──────────────────────────────────────────────────────── */
#stateRec {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 240px;
}

.rec-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #ff3b30;
  flex-shrink: 0;
  animation: pulse 0.6s ease-in-out infinite;
}

@keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

.rec-timer {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 14px;
  color: rgba(255,255,255,0.9);
  min-width: 34px;
  letter-spacing: 0.02em;
}

.waveform-wrap {
  flex: 1;
  height: 20px;
  position: relative;
}

canvas#wave {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

.ctx-icon {
  background: rgba(0,122,255,0.15);
  border-radius: 20px;
  padding: 4px 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Processing state ─────────────────────────────────────────────────────── */
#stateProc {
  display: none;
  align-items: center;
  gap: 10px;
  width: 230px;
  justify-content: center;
}

.spinner {
  width: 14px; height: 14px;
  border: 1.5px solid rgba(255,255,255,0.18);
  border-top-color: rgba(255,255,255,0.85);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.proc-text { font-size: 13px; color: rgba(255,255,255,0.55); }

/* ── Result state ─────────────────────────────────────────────────────────── */
#stateRes {
  display: none;
  flex-direction: column;
  gap: 5px;
  width: 290px;
}

.res-header {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: rgba(255,255,255,0.45);
}

.res-check { color: #30d158; font-size: 12px; }

.res-tag {
  margin-left: auto;
  background: rgba(255,255,255,0.08);
  padding: 2px 7px;
  border-radius: 10px;
  font-size: 10px;
}

.res-body {
  font-size: 12px;
  color: rgba(255,255,255,0.82);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ── Chat window ──────────────────────────────────────────────────────────── */
.chat-win {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 500px;
  height: 390px;
  background: rgba(26,26,28,0.94);
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  overflow: hidden;
  box-shadow: 0 24px 70px rgba(0,0,0,0.55);
  display: flex;
  flex-direction: column;
}

.win-bar {
  height: 38px;
  background: rgba(40,40,42,0.98);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 7px;
  flex-shrink: 0;
}

.tl { width: 12px; height: 12px; border-radius: 50%; }
.tl-r { background: #ff5f57; }
.tl-y { background: #febc2e; }
.tl-g { background: #28c840; }

.win-title {
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  margin-left: 6px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scrollbar-width: none;
}
.messages::-webkit-scrollbar { display: none; }

.msg { display: flex; flex-direction: column; gap: 3px; }
.msg.them { align-items: flex-start; }
.msg.me   { align-items: flex-end; }

.bubble {
  max-width: 72%;
  padding: 8px 12px;
  border-radius: 17px;
  font-size: 13px;
  line-height: 1.45;
}

.msg.them .bubble {
  background: rgba(54,54,58,0.95);
  color: rgba(255,255,255,0.88);
  border-bottom-left-radius: 5px;
}

.msg.me .bubble {
  background: #0A84FF;
  color: #fff;
  border-bottom-right-radius: 5px;
}

.ts {
  font-size: 10px;
  color: rgba(255,255,255,0.25);
  padding: 0 4px;
}

.input-bar {
  min-height: 46px;
  border-top: 1px solid rgba(255,255,255,0.06);
  background: rgba(38,38,40,0.9);
  display: flex;
  align-items: flex-end;
  padding: 8px 12px;
  gap: 8px;
  flex-shrink: 0;
}

.msg-input {
  flex: 1;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 7px 13px;
  font-size: 13px;
  font-family: inherit;
  color: rgba(255,255,255,0.82);
  outline: none;
  caret-color: #0A84FF;
  resize: none;
  overflow: hidden;
  line-height: 1.4;
  max-height: 100px;
}
.msg-input::placeholder { color: rgba(255,255,255,0.2); }

.send-btn {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: rgba(10,132,255,0.2);
  border: 1px solid rgba(10,132,255,0.3);
  color: rgba(10,132,255,0.6);
  font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  cursor: default;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}

.send-btn.active {
  background: #0A84FF;
  border-color: #0A84FF;
  color: #fff;
}
</style>
</head>

<script>
// ── Canvas setup (DPR-aware) ────────────────────────────────────────────────
const canvas = document.getElementById('wave');
const wrapEl = canvas.parentElement;
const dpr    = window.devicePixelRatio || 1;

function resizeCanvas() {
  const rect = wrapEl.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
}
resizeCanvas();
const ctx = canvas.getContext('2d');
ctx.scale(dpr, dpr);

// ── Waveform — exact port of Swift WaveformView ────────────────────────────
// Colors match Sources/IntelliWhisper/UI/FloatingPanelView.swift WaveformView
const WAVES = [
  { r:   0, g: 0x62, b: 0x55, scale: 0.50, opacity: 0.28 },
  { r:   0, g: 0x78, b: 0x66, scale: 0.65, opacity: 0.38 },
  { r:   0, g: 0x98, b: 0x80, scale: 0.82, opacity: 0.52 },
  { r:   0, g: 0xBE, b: 0x9A, scale: 1.00, opacity: 0.60 },
];

let smoothLevel = 0;
let targetLevel = 0;
let waveRunning = false;
let rafId       = null;
let waveT0      = null;

function drawWave(ts) {
  if (!waveT0) waveT0 = ts;
  const t = (ts - waveT0) / 1000;

  const W = wrapEl.getBoundingClientRect().width;
  const H = wrapEl.getBoundingClientRect().height;
  ctx.clearRect(0, 0, W, H);

  // Smooth the level (mirrors Swift's onChange logic)
  const w = targetLevel > smoothLevel ? 0.18 : 0.25;
  smoothLevel = Math.min(0.6, smoothLevel * (1 - w) + targetLevel * w);

  const cy = H / 2;

  WAVES.forEach((wave, i) => {
    const phaseShift = i * 0.7;
    const freq       = 1.8 + i * 0.4;
    const phase      = t * 2.0 + phaseShift;
    const amp        = cy * 1.6 * wave.scale * (0.05 + smoothLevel * 0.95);
    const color      = `rgb(${wave.r},${wave.g},${wave.b})`;

    // Upper path
    ctx.beginPath();
    ctx.globalAlpha = wave.opacity;
    ctx.strokeStyle  = color;
    ctx.lineWidth    = 1.2;
    ctx.lineCap      = 'round';
    ctx.lineJoin     = 'round';
    for (let x = 0; x <= W; x += 0.5) {
      const p        = x / W;
      const envelope = Math.sin(p * Math.PI);
      const y        = cy + Math.sin(phase + p * freq * Math.PI * 2) * amp * envelope;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Lower path (mirrored, 50% amp)
    ctx.beginPath();
    ctx.lineWidth = 0.6;
    for (let x = 0; x <= W; x += 0.5) {
      const p        = x / W;
      const envelope = Math.sin(p * Math.PI);
      const y        = cy - Math.sin(phase + p * freq * Math.PI * 2) * amp * 0.5 * envelope;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Soft glow on brightest layer
    if (i === WAVES.length - 1) {
      ctx.beginPath();
      ctx.lineWidth   = 3;
      ctx.globalAlpha = 0.10;
      for (let x = 0; x <= W; x += 0.5) {
        const p        = x / W;
        const envelope = Math.sin(p * Math.PI);
        const y        = cy + Math.sin(phase + p * freq * Math.PI * 2) * amp * envelope;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  });

  ctx.globalAlpha = 1;
  if (waveRunning) rafId = requestAnimationFrame(drawWave);
}

function startWave() {
  waveRunning = true;
  waveT0 = null;
  rafId  = requestAnimationFrame(drawWave);
}

function stopWave() {
  waveRunning = false;
  cancelAnimationFrame(rafId);
  const W = wrapEl.getBoundingClientRect().width;
  const H = wrapEl.getBoundingClientRect().height;
  ctx.clearRect(0, 0, W, H);
}

// ── Voice level simulation ─────────────────────────────────────────────────
let levelIv;

function startVoice() {
  let tick = 0;
  levelIv = setInterval(() => {
    tick++;
    if (tick < 10) {
      // Ramp up
      targetLevel = (tick / 10) * 0.52;
    } else {
      // Natural speech variation
      const base  = 0.38 + Math.sin(tick * 0.28) * 0.14;
      const noise = (Math.random() - 0.5) * 0.22;
      targetLevel = Math.max(0.04, Math.min(0.82, base + noise));
    }
  }, 100);
}

function stopVoice() {
  clearInterval(levelIv);
  targetLevel = 0;
}

// ── Timer ──────────────────────────────────────────────────────────────────
let timerIv;
let timerSec = 0;
const timerEl = document.getElementById('recTimer');

function startTimer() {
  timerSec = 0;
  timerEl.textContent = '0:00';
  timerIv = setInterval(() => {
    timerSec++;
    const m = Math.floor(timerSec / 60);
    const s = timerSec % 60;
    timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
  }, 1000);
}

function stopTimer() { clearInterval(timerIv); }

// ── Pill helpers ───────────────────────────────────────────────────────────
const pillWrap  = document.getElementById('pillWrap');
const pillEl    = document.getElementById('pill');
const stateRec  = document.getElementById('stateRec');
const stateProc = document.getElementById('stateProc');
const stateRes  = document.getElementById('stateRes');

function showPill()  { pillWrap.classList.add('visible'); }
function hidePill()  { pillWrap.classList.remove('visible'); }

function setState(name) {
  stateRec.style.display  = name === 'rec'  ? 'flex'   : 'none';
  stateProc.style.display = name === 'proc' ? 'flex'   : 'none';
  stateRes.style.display  = name === 'res'  ? 'flex'   : 'none';
  pillEl.classList.toggle('glow', name === 'proc');
}

// ── Chat helpers ───────────────────────────────────────────────────────────
const msgsEl  = document.getElementById('messages');
const inputEl = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

const DEMO_TEXT = "We covered the Q3 roadmap, agreed to prioritise the mobile release, and set the code freeze for Thursday.";

let typeIv;
let lastMsg = null;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function typeText(text, onDone) {
  inputEl.value = '';
  autoResize(inputEl);
  sendBtn.classList.remove('active');
  // Instant paste — flash the field then show full text at once
  inputEl.style.transition = 'background 0.08s ease';
  inputEl.style.background = 'rgba(255,255,255,0.18)';
  setTimeout(() => {
    inputEl.style.background = '';
    inputEl.value = text;
    autoResize(inputEl);
    sendBtn.classList.add('active');
    onDone && onDone();
  }, 80);
}

function appendMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg me';
  div.innerHTML = `<div class="bubble">${text}</div><div class="ts">9:41 AM</div>`;
  div.style.opacity = '0';
  div.style.transition = 'opacity 0.3s ease';
  msgsEl.appendChild(div);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  requestAnimationFrame(() => { div.style.opacity = '1'; });
  lastMsg = div;
}

function removeLastMessage() {
  if (lastMsg) { lastMsg.remove(); lastMsg = null; }
}

// ── Demo sequencer ─────────────────────────────────────────────────────────
// Timeline:
//   0.0 s  idle — chat visible, no pill
//   1.0 s  pill in → recording (waveform + timer start)
//   5.2 s  → processing (teal glow)
//   7.0 s  → result state
//   7.4 s  text types into input field
//   9.8 s  pill out, message appended
//  13.5 s  reset + loop

const timeouts = [];

function after(ms, fn) {
  timeouts.push(setTimeout(fn, ms));
}

function clearAll() {
  timeouts.forEach(clearTimeout);
  timeouts.length = 0;
  clearInterval(typeIv);
}

function runDemo() {
  clearAll();

  // ── Reset ──
  hidePill();
  setState('rec');
  stopTimer();
  stopWave();
  stopVoice();
  smoothLevel = 0;
  inputEl.value = '';
  sendBtn.classList.remove('active');
  removeLastMessage();
  document.getElementById('resBody').textContent = '';

  // ── Phase 1: recording ──
  after(1000, () => {
    setState('rec');
    showPill();
    startTimer();
    startWave();
    startVoice();
  });

  // ── Phase 2: processing ──
  after(5200, () => {
    stopTimer();
    stopVoice();
    targetLevel = 0;
    setState('proc');
  });

  // ── Phase 3: result ──
  after(7000, () => {
    stopWave();
    smoothLevel = 0;
    document.getElementById('resBody').textContent = DEMO_TEXT;
    setState('res');
  });

  // ── Phase 4: type into input ──
  after(7400, () => {
    typeText(DEMO_TEXT);
  });

  // ── Phase 5: send + hide pill ──
  after(9800, () => {
    clearInterval(typeIv);
    hidePill();
    appendMessage(DEMO_TEXT);
    inputEl.value = '';
    autoResize(inputEl);
    sendBtn.classList.remove('active');
  });

  // ── Loop ──
  after(14000, runDemo);
}

// Kick off after a short initial pause
setTimeout(runDemo, 600);
</script>
